[package]
name = "vigil"
version = "0.1.0"
edition = "2024"
description = "Behavioral anomaly detection for AI agents"
license = "MIT"
repository = "https://github.com/o-hill/vigil"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
chrono = { version = "0.4.43", features = ["serde"] }
dirs = "6.0.0"
futures-core = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
