[package]
name = "vigil"
version = "0.1.0"
edition = "2024"
description = "Behavioral anomaly detection for AI agents"
license = "MIT"
repository = "https://github.com/o-hill/vigil"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
futures-core = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
